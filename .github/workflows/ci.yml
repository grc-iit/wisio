name: Build and Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, dev]
    tags:
      - "v*.*.*" # Match version tags like v1.0.0, v0.1.2, etc.
  workflow_dispatch:
    inputs:
      run_full_tests:
        description: "Run full test suite"
        type: boolean
        default: false

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-22.04"]
        python: ["3.10", "3.11", "3.12", "3.13"]
    name: ${{ matrix.os }}-${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    # Sized for the full tier, which only runs on release tags and manual
    # dispatch; the smoke tier every push takes about 6 minutes. The full tier
    # is 16 e2e runs plus the characterization and dual-engine suites, and it
    # should now finish well inside this -- the reason it blew past 30 minutes
    # on the v0.2.0 tag was leaked Dask workers, fixed separately, not the size
    # of the suite. The headroom stays because a timeout reports as a failure
    # and says nothing about what actually went wrong.
    timeout-minutes: 60
    env:
      OMPI_ALLOW_RUN_AS_ROOT: 1
      OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1
      ARROW_VERSION: 25.0.1-1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            ca-certificates \
            lsb-release \
            wget
          wget https://apache.jfrog.io/artifactory/arrow/$(lsb_release --id --short | tr 'A-Z' 'a-z')/apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb
          sudo apt install -y ./apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb
          sudo apt update
          # Arrow is pinned. The apt source above is "latest", so leaving these
          # unpinned lets Arrow roll forward on its own -- which is exactly how
          # the build broke in #4, when its headers started requiring C++20. A
          # stale pin fails loudly ("Version ... was not found") instead of as a
          # wall of compiler errors. Bump deliberately, together with pyarrow.
          sudo apt install -y \
            build-essential \
            cmake \
            git \
            libarrow-dev=${{ env.ARROW_VERSION }} \
            libhdf5-dev \
            libncurses-dev \
            libopenmpi-dev \
            libparquet-dev=${{ env.ARROW_VERSION }} \
            libreadline-dev \
            ninja-build \
            nlohmann-json3-dev \
            openmpi-bin \
            openmpi-common

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade "meson>=1.5.0,<1.10.0" meson-python setuptools wheel
          pip install -r tests/requirements.txt

      - name: Install WisIO
        run: |
          pip install .[darshan,dftracer] \
            -Csetup-args="--prefix=$HOME/.local" \
            -Csetup-args="-Denable_tests=true" \
            -Csetup-args="-Denable_tools=true"

      - name: Determine test type
        id: test-type
        run: |
          # Check if this is a tagged release (v*.*.*)
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "Run full test suite for release tag"
            echo "run_full=true" >> $GITHUB_OUTPUT
          # Check if this is a manual run requesting full tests
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.run_full_tests }}" == "true" ]]; then
            echo "Run full test suite due to manual request"
            echo "run_full=true" >> $GITHUB_OUTPUT
          else
            echo "Run smoke tests for regular development"
            echo "run_full=false" >> $GITHUB_OUTPUT
          fi

      - name: Run Python tests with coverage
        run: |
          if [[ "${{ steps.test-type.outputs.run_full }}" == "true" ]]; then
            echo "Running FULL test suite"
            pytest -m full --verbose --cov=wisio --cov-report=xml
          else
            echo "Running SMOKE test suite"
            pytest -m smoke --verbose --cov=wisio --cov-report=xml
          fi

      - name: Run C++ tests
        run: |
          meson build --prefix=$HOME/.local --reconfigure -Denable_tests=true -Denable_tools=true
          meson compile -C build --verbose
          meson test -C build --verbose
          meson test -C build --verbose --setup=mpi

      - name: Run WisIO
        run: |
          # The [darshan] extra carries a `python_version < "3.13"` marker, so
          # on the 3.13 leg it resolves to nothing and the reader is absent by
          # design -- see pyproject.toml. The pytest suite skips the same way;
          # this keeps the rest of the matrix exercising darshan rather than
          # dropping 3.13 entirely.
          if python -c "import darshan" >/dev/null 2>&1; then
            wisio +analyzer=darshan percentile=0.99 trace_path=tests/data/extracted/darshan-raw view_types=[file_name,proc_name] metrics=[time]
            wisio +analyzer=darshan percentile=0.99 trace_path=tests/data/extracted/darshan-dxt
          else
            echo "Skipping darshan analyzers: no working [darshan] extra on $(python -V)"
          fi
          wisio +analyzer=dftracer percentile=0.99 trace_path=tests/data/extracted/dftracer-posix
          wisio +analyzer=dftracer percentile=0.99 trace_path=tests/data/extracted/dftracer-dlio
          wisio +analyzer=recorder percentile=0.99 trace_path=tests/data/extracted/recorder-parquet

      - name: Upload test coverage
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            build/meson-logs/
            .coverage
            coverage.xml
          retention-days: 7
