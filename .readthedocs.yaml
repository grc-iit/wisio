# Read the Docs build configuration.
#
# The docs are built from docs/ with Sphinx and the Read the Docs theme. They
# intentionally do not install the wisio package: the Python API page is
# curated by hand, so the documentation build needs neither the C++/Arrow
# toolchain nor the optional trace readers.
#
# https://docs.readthedocs.com/platform/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py
  # Keep the published site warning-free. Fix warnings locally with:
  #   sphinx-build -b html -W --keep-going docs docs/_build/html
  fail_on_warning: true

python:
  install:
    - requirements: docs/requirements.txt
