[build-system]
build-backend = "mesonpy"
requires = ["meson>=1.5.0,<1.10.0", "meson-python>=0.15.0"]

[project]
name = "wisio"
version = "0.2.1"
description = "Analyze, visualize, and understand I/O performance issues in HPC workflows"
authors = [{ name = "Izzet Yildirim", email = "izzetcyildirim@gmail.com" }]
maintainers = [{ name = "Izzet Yildirim", email = "izzetcyildirim@gmail.com" }]
requires-python = ">=3.10"
readme = { file = "README.md", content-type = "text/markdown" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Build Tools",
    "Typing :: Typed",
]
dependencies = [
    "betterframe[dask]>=0.3.0",
    "dask[bag,dataframe,distributed]>=2024.1.0",
    "dask_jobqueue>=0.8.0",
    "hydra-core~=1.3.0",
    "inflect>=7.0",
    "jinja2>=3.0",
    "numpy>=1.26",
    "matplotlib>=3.6.0",
    # pandas 3 makes copy-on-write and the string dtype the default; that is a
    # behavior change wide enough to warrant its own migration.
    "pandas>=2.0,<3.0",
    "portion>=2.4.0",
    "pyarrow>=13",
    "pyyaml>=5.4",
    "rich>=13.6",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "venn==0.1.3",
]

[project.optional-dependencies]
# pydarshan publishes CPython wheels only up to cp312. On 3.13 pip falls back
# to the sdist, which builds a pure-python `py3-none-any` wheel carrying no
# libdarshan-util.so, so `import darshan` then raises RuntimeError -- an extra
# that installs successfully and cannot work. The marker makes the extra a
# no-op there instead, so `pip install wisio[darshan]` on 3.13 gets a working
# WisIO without the darshan reader rather than a broken one. Darshan support is
# honestly 3.10-3.12; do not lift the marker until pydarshan ships a cp313
# wheel. WisIO still degrades at runtime if the extra is simply absent -- see
# the optional-import guard in wisio/__init__.py.
darshan = ["darshan>=3.4; python_version < '3.13'"]
dftracer = ["dftracer-utils>=0.0.12"]
web = ["altair>=5.0", "streamlit>=1.40"]

[project.scripts]
wisio = "wisio.__main__:main"

[project.urls]
Homepage = "https://grc.iit.edu/docs/category/wisio/"
Documentation = "https://grc.iit.edu/docs/category/wisio/"
Repository = "https://github.com/grc-iit/wisio"
Issues = "https://github.com/grc-iit/wisio/issues"
Changelog = "https://github.com/grc-iit/wisio/releases"

[tool.meson-python.args]
install = ["--skip-subprojects"]

[tool.pyright]
exclude = ["assets/", "build/", "subprojects/", "tmp/"]

[tool.pytest.ini_options]
markers = [
    "smoke: minimal test subset for quick validation (select with '-m smoke')",
    "full: comprehensive test suite with all parameter combinations (select with '-m full')",
]
filterwarnings = [
    "ignore:The distutils package is deprecated and slated for removal.*:DeprecationWarning",
]

[tool.ruff]
line-length = 119

[tool.ruff.format]
quote-style = "preserve"

[tool.spin]
package = 'wisio'
